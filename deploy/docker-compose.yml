# GPU app machine. From the repo root:
#   cp .env.example .env
#   docker compose -f deploy/docker-compose.yml run --rm speech-models
#   docker compose -f deploy/docker-compose.yml up --build -d
#
# Requires NVIDIA driver + nvidia-container-toolkit on the host.

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  postgres:
    image: postgres:16-alpine
    # POSTGRES_PASSWORD is a secret: load it from env_file, not `${VAR}`
    # here. The latter is resolved by Compose against a project-directory
    # .env (relative to this file's folder) rather than the real ../.env,
    # so it silently fell back to the literal default below unless that
    # exact variable also happened to be exported in the invoking shell —
    # causing this service and backend/celery (which read the real secret
    # via their own env_file) to initialize/authenticate with different
    # passwords.
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: caller
      POSTGRES_USER: caller
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caller -d caller"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../.env
    environment:
      # POSTGRES_PASSWORD and SPEECH_API_TOKEN are secrets: they come from
      # env_file above. Do not re-declare them as `${VAR}` here -- Compose
      # resolves that against a project-directory .env this repo doesn't
      # have, silently blanking/defaulting them instead of using the real
      # env_file value (see the postgres service for the full story).
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "0"
      SPEECH_STT_URL: ${SPEECH_STT_URL:-http://speech-stt:8000}
      SPEECH_TTS_URL: ${SPEECH_TTS_URL:-http://speech-tts:8000/v1}
      SPEECH_VOICE_NAME: ${SPEECH_VOICE_NAME:-siya}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      speech-stt:
        condition: service_healthy
      speech-tts:
        condition: service_healthy

  celery:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: celery -A config worker --loglevel=info
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      SPEECH_STT_URL: ${SPEECH_STT_URL:-http://speech-stt:8000}
      SPEECH_TTS_URL: ${SPEECH_TTS_URL:-http://speech-tts:8000/v1}
    depends_on:
      - backend
      - redis

  celery-beat:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: celery -A config beat --loglevel=info
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - backend

  context-guard:
    build:
      context: ../context_guard
    env_file:
      - ../.env
    environment:
      # Only literal, non-secret values here. UPSTREAM_LLM_API_KEY and
      # INTERNAL_API_TOKEN come from env_file above; re-declaring them as
      # `${VAR}` made Compose resolve them against its own project-directory
      # .env lookup (which is relative to this file's folder, not the repo
      # root) instead of the env_file value, blanking them out whenever
      # Compose is invoked without that exact variable already exported in
      # the calling shell.
      UPSTREAM_LLM_BASE_URL: ${UPSTREAM_LLM_BASE_URL:-https://api.openai.com/v1}
      UPSTREAM_LLM_MODEL: ${UPSTREAM_LLM_MODEL:-gpt-4o-mini}
      BACKEND_INTERNAL_URL: http://backend:8000
      SPEECH_TTS_URL: ${SPEECH_TTS_URL:-http://speech-tts:8000/v1}
      # SPEECH_API_TOKEN is a secret: it must come from env_file above, not
      # be re-declared here (same shadowing bug as the comment above).
    depends_on:
      - backend
      - speech-tts

  # One-shot: download Nemotron STT + dhee-indic-f5 + smart-turn into the
  # shared volume. Re-run after wiping the volume or changing model ids.
  speech-models:
    build:
      context: ../speech
      dockerfile: models/Dockerfile.export
    environment:
      MODELS_DIR: /models
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      SKIP_NEMOTRON_EXPORT: "1"
    volumes:
      - speech-models:/models
    profiles: ["models"]

  speech-stt:
    <<: *gpu
    gpus: all
    build:
      context: ../speech/stt
    # SPEECH_API_TOKEN is a secret: load it from env_file, not `${VAR}`
    # here (same shadowing bug documented on the postgres/backend
    # services). Without this, speech-stt always ran with an empty token,
    # i.e. with auth silently disabled.
    env_file:
      - ../.env
    environment:
      MODELS_DIR: /models
      STT_MODEL_DIR: /models/stt/nemotron
      SMART_TURN_PATH: /models/stt/smart-turn/smart-turn-v3-gpu.onnx
      SHERPA_PROVIDER: ${SHERPA_PROVIDER:-cuda}
    volumes:
      - speech-models:/models:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  speech-tts:
    <<: *gpu
    gpus: all
    build:
      context: ../speech/tts
    # SPEECH_API_TOKEN is a secret: load it from env_file, not `${VAR}`
    # here (same shadowing bug documented on the postgres/backend
    # services). Without this, speech-tts always ran with an empty token,
    # i.e. with auth silently disabled.
    env_file:
      - ../.env
    environment:
      MODELS_DIR: /models
      TTS_MODEL_DIR: /models/tts/dhee-indic-f5
      TTS_VOICES_DIR: /models/tts/voices
      TTS_DEVICE: cuda
      TTS_NFE: ${TTS_NFE:-16}
      HF_HOME: /models/hf-cache
      DHEE_HF_ID: ${DHEE_HF_ID:-dheeyantra/dhee-indic-f5}
      # IndicF5 custom code lives on the models volume (f5_tts package).
      PYTHONPATH: /models/tts/dhee-indic-f5
    volumes:
      - speech-models:/models
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 240s

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ""
    environment:
      DISABLE_API_PROXY: "1"

  asterisk:
    profiles: ["whatsapp-calling"]
    build:
      context: ./asterisk
    network_mode: host
    environment:
      ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:-dograh}
      AMI_SECRET: ${ASTERISK_AMI_SECRET:-caller}
      SIP_HOSTNAME: ${SIP_HOSTNAME:-sip.example.com}
    volumes:
      - asterisk-config:/etc/asterisk/generated

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-ops@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - backend
      - frontend

networks:
  default:
    name: caller

volumes:
  pgdata:
  caddy-data:
  asterisk-config:
  speech-models:
