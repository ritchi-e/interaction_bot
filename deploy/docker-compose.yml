# App machine. From the repo root:
#   cp .env.example .env
#   docker compose -f deploy/docker-compose.yml up --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caller
      POSTGRES_USER: caller
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caller}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caller -d caller"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caller}
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: celery -A config worker --loglevel=info
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caller}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis

  celery-beat:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: celery -A config beat --loglevel=info
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caller}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - backend

  context-guard:
    build:
      context: ../context_guard
    env_file:
      - ../.env
    environment:
      # Only literal, non-secret values here. UPSTREAM_LLM_API_KEY and
      # INTERNAL_API_TOKEN come from env_file above; re-declaring them as
      # `${VAR}` made Compose resolve them against its own project-directory
      # .env lookup (which is relative to this file's folder, not the repo
      # root) instead of the env_file value, blanking them out whenever
      # Compose is invoked without that exact variable already exported in
      # the calling shell.
      UPSTREAM_LLM_BASE_URL: ${UPSTREAM_LLM_BASE_URL:-https://api.openai.com/v1}
      UPSTREAM_LLM_MODEL: ${UPSTREAM_LLM_MODEL:-gpt-4o-mini}
      BACKEND_INTERNAL_URL: http://backend:8000
      RUMIK_BRIDGE_URL: http://rumik-bridge:8080/v1
    depends_on:
      - backend

  # OpenAI-compatible facade in front of Rumik's streaming TTS, so Dograh can
  # point its TTS provider at Rumik's low-latency WebSocket voice without a
  # native integration. See context_guard/rumik_bridge.py for how a
  # workflow's TTS `model` string picks a language-specific voice preset.
  rumik-bridge:
    build:
      context: ../context_guard
    command: uvicorn rumik_bridge:app --host 0.0.0.0 --port 8080
    env_file:
      - ../.env
    # RUMIK_API_KEY comes from env_file above; see the comment on
    # context-guard's environment block for why it must not be re-declared
    # here as `${RUMIK_API_KEY:-}`.

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ""
    environment:
      DISABLE_API_PROXY: "1"

  asterisk:
    profiles: ["whatsapp-calling"]
    build:
      context: ./asterisk
    network_mode: host
    environment:
      ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:-dograh}
      AMI_SECRET: ${ASTERISK_AMI_SECRET:-caller}
      SIP_HOSTNAME: ${SIP_HOSTNAME:-sip.example.com}
    volumes:
      - asterisk-config:/etc/asterisk/generated

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-ops@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - backend
      - frontend

networks:
  default:
    name: caller

volumes:
  pgdata:
  caddy-data:
  asterisk-config:
