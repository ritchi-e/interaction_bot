# Use the already-running Svara server. Do not start Mistral Voxtral.
#   docker compose -p caller --env-file .env \
#     -f deploy/docker-compose.yml -f deploy/docker-compose.data.yml \
#     -f deploy/svara.host.yml up -d --build

services:
  voxtral-tts:
    profiles: ["mistral-tts"]

  speech-tts:
    profiles: ["mistral-tts"]

  backend:
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPEECH_TTS_URL: http://svara-tts-api:8080/v1

  celery:
    environment:
      SPEECH_TTS_URL: http://svara-tts-api:8080/v1

  celery-beat:
    environment:
      SPEECH_TTS_URL: http://svara-tts-api:8080/v1

  context-guard:
    depends_on: !override
      - backend
    environment:
      SPEECH_TTS_URL: http://svara-tts-api:8080/v1
